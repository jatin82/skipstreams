<!DOCTYPE html>
<html data-url="https://www.hotstar.com/in">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=1920, initial-scale=1.0">
	<title>JioHotstar TV</title>
	<script src="$WEBAPIS/webapis/webapis.js"></script>
	<link rel="stylesheet" href="launcher.css">
</head>
<body>
	<div class="box">
		<div class="logo">jio<span>hotstar</span></div>
		<div id="spinner" class="spinner"></div>
		<div id="status">Starting…</div>
		<div id="hint" class="hint"></div>
		<div id="movie" class="movie hidden">
			<h2>Which movie?</h2>
			<div id="movie-url" class="movie-url"></div>
			<label>Movie name</label>
			<input id="movie-name" type="text" placeholder="e.g. superman" autocomplete="off">
			<label>Movie number</label>
			<input id="movie-number" type="tel" inputmode="numeric" placeholder="e.g. 1271509950" autocomplete="off">
			<div id="movie-error" class="movie-error"></div>
			<button id="movie-play" type="button">Play</button><button id="movie-home" type="button">Hotstar home</button>
			<div class="hint">Up/Down: move &nbsp; OK: type or press &nbsp; Back: exit</div>
		</div>
	</div>
	<script src="launcher.js"></script>
</body>
</html>
